services:
    app:
        build: .
        container_name: mensola-api
        ports:
            - "3457:3000"
        environment:
            - PORT=${PORT}
            - POSTGRES_HOST=db
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./src:/usr/src/app/src
        command: npm run dev

    db:
        image: postgres:15-alpine
        container_name: mensola-db
        restart: always
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - "4361:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
            interval: 3s
            timeout: 3s
            retries: 5

volumes:
    pgdata:
